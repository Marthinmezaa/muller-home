name: DevSecOps

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# ponytail: CodeQL fuera hasta que exista código JS/TS real (falla si no hay
# nada que indexar). Volver a agregar el job cuando arranque apps/api o apps/web.
jobs:
  secrets-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
